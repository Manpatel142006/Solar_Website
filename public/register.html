<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Registration | Energy Solutions</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .glass-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            width: 100%;
            max-width: 420px;
        }

        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: none;
            background-color: #020617;
            color: white;
        }
    </style>
</head>

<body>
    <div class="glass-card p-4 p-lg-5 shadow-lg">
        <h3 class="text-center text-white mb-2 fw-bold">Customer Registration</h3>
        

        <form onsubmit="registerUser(event)">
    
            <div class="mb-3">
                <label for="reg-name" class="form-label text-secondary small text-uppercase fw-bold mb-1">Full
                    Name</label>
                <input type="text" id="reg-name" class="form-control bg-dark text-white border-secondary py-2"
                    placeholder="e.g. Ramesh Mehta" required>
            </div>

     
            <div class="mb-3">
                <label for="reg-email" class="form-label text-secondary small text-uppercase fw-bold mb-1">Email
                    Address</label>
                <input type="email" id="reg-email" class="form-control bg-dark text-white border-secondary py-2"
                    placeholder="name@email.com" required>
            </div>

            
            <div class="mb-4">
                <label for="reg-password" class="form-label text-secondary small text-uppercase fw-bold mb-1">Create
                    Password</label>
                <input type="password" id="reg-password" class="form-control bg-dark text-white border-secondary py-2"
                    required>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 shadow">Create Account</button>

            <div class="text-center mt-2">
                <a href="login.html" class="text-secondary small text-decoration-none hover-text-white">Already have an
                    account? Log In</a>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
</body>

</html>
