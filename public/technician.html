<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Technician Dashboard | Energy Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .glass-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark border-bottom">
        <div class="container-fluid">
            <span class="navbar-brand text-info font-weight-bold">Technician Portal</span>
            <div>
                <span class="me-3 text-secondary">Tech: <span id="user-display-name" class="text-white"></span></span>
                <button onclick="logoutUser()" class="btn btn-sm btn-danger">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="glass-card p-4 shadow">
            <h4 class="mb-2">Assigned Field Tasks</h4>
            <p class="text-secondary small mb-4">Update the status of operational tickets. You cannot delete records.
            </p>

            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Client Details</th>
                            <th>Hardware Problem</th>
                            <th>Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="techTableBody">
                      
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        checkAuth('technician');

        function loadTechTable() {
            const complaints = JSON.parse(localStorage.getItem('solar_complaints')) || [];
            const tbody = document.getElementById('techTableBody');
            tbody.innerHTML = '';

            if (complaints.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary">No pending tasks.</td></tr>';
                return;
            }

            complaints.forEach((c, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-secondary small">${c.id}</td>
                        <td>
                            <strong>${c.customerName}</strong><br>
                            <span class="text-secondary font-monospace small">${c.phone}</span>
                        </td>
                        <td class="text-light">${c.problem}</td>
                        <td>
                            <select onchange="updateStatus(${index}, this.value)" class="form-select form-select-sm bg-dark text-white border-secondary">
                                <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Completed" ${c.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStatus(index, newStatus) {
            let complaints = JSON.parse(localStorage.getItem('solar_complaints')) || [];
            complaints[index].status = newStatus;
            localStorage.setItem('solar_complaints', JSON.stringify(complaints));
           
        }

        loadTechTable(); 
    </script>
</body>

</html>
