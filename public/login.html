<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Login | Energy Solutions</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .glass-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: none;
            background-color: #020617;
            color: white;
        }

        .bg-amber {
            background-color: #f59e0b;
            color: #020617;
        }
    </style>
</head>

<body>
    <div class="glass-card p-4 p-lg-5 shadow-lg">
        <h3 class="text-center text-white mb-2 fw-bold">System Login</h3>
        <p class="text-center text-secondary small mb-4">Please identify your access level.</p>

        <!-- Toggle Tabs: Required for the script to know WHO is logging in -->
        <div class="d-flex bg-dark border border-secondary p-1 rounded-3 mb-4">
            <button type="button" id="tab-customer" onclick="setLoginType('customer')"
                class="btn bg-amber fw-bold text-uppercase px-4 py-2 w-100 rounded-3"
                style="font-size: 0.8rem;">Customer</button>
            <button type="button" id="tab-staff" onclick="setLoginType('staff')"
                class="btn text-secondary fw-bold text-uppercase px-4 py-2 w-100 rounded-3"
                style="font-size: 0.8rem;">Staff</button>
        </div>

        <form onsubmit="loginUser(event)">
            <!-- HIDDEN INPUT: This prevents JavaScript from crashing -->
            <input type="hidden" id="login-type" value="customer">

            <div class="mb-3">
                <label for="login-email" class="form-label text-secondary small text-uppercase fw-bold mb-1">Email
                    Address</label>
                <input type="email" id="login-email" class="form-control bg-dark text-white border-secondary py-2"
                    placeholder="name@email.com" required>
            </div>

            <div class="mb-4">
                <label for="login-password"
                    class="form-label text-secondary small text-uppercase fw-bold mb-1">Password</label>
                <input type="password" id="login-password" class="form-control bg-dark text-white border-secondary py-2"
                    placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-4 shadow">Verify & Login</button>

            <div class="d-flex justify-content-between align-items-center px-1">
                <a href="index.html" class="text-secondary small text-decoration-none fw-semibold hover-text-white">←
                    Back to Home</a>
                <a href="register.html" class="text-warning small text-decoration-none fw-bold hover-text-white">Create
                    Customer Account</a>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
</body>

</html>
